# Hyprland config for running the beckon live suite nested inside another
# compositor. See the "Hyprland" section of testing/README.md for the full
# recipe; this file is only the compositor half of it.
#
# Deliberately starts nothing. The suite spawns and kills its own windows, and
# anything autostarted here would be an extra client its oracle has to explain
# — and step 5c only runs when the target is the ONLY window in the session,
# so a stray client silently turns that test into a skip.
monitor = , 1600x1000@60, 0x0, 1

general {
    border_size = 1
    gaps_in = 2
    gaps_out = 4
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# Off so a focus assertion never races a fade: the suite polls the compositor
# immediately after each `beckon` call.
animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_autoreload = true
}

# The suite drives everything through hyprctl, so no keybinds are needed.
# One escape hatch for a human watching the nested window:
bind = SUPER SHIFT, Q, exit
