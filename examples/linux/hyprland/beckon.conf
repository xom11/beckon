# beckon bindings for Hyprland. Save at ~/.config/hypr/beckon.conf and
# add this line to your ~/.config/hypr/hyprland.conf:
#
#   source = ~/.config/hypr/beckon.conf
#
# Hyprland reloads automatically on file change.
#
# Discover ids on your machine:
#   beckon installed          list installed apps
#   beckon list               list currently running apps
#   beckon search files       fuzzy search
#   beckon resolve Spotify    validate an id

# Ctrl + Super + Alt, the same chord every other example here uses, in the order
# the three keys sit in on the bottom row.
#
# `$beckonMod`, not `$mainMod`: this file gets `source`d into your config, and
# `$mainMod` is almost certainly already defined there — reassigning it would
# silently move every binding you have.
$beckonMod = CTRL SUPER ALT

bind = $beckonMod, T, exec, beckon kitty
bind = $beckonMod, C, exec, beckon "Google Chrome"
bind = $beckonMod, V, exec, beckon "Visual Studio Code"
bind = $beckonMod, F, exec, beckon Files
bind = $beckonMod, S, exec, beckon Spotify
