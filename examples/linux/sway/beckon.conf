# beckon bindings for sway. Save at ~/.config/sway/beckon.conf and add
# this line to your ~/.config/sway/config:
#
#   include ~/.config/sway/beckon.conf
#
# Reload: swaymsg reload (or $mod+Shift+c if you keep the default binding).
#
# Discover ids on your machine:
#   beckon installed          list installed apps
#   beckon list               list currently running apps
#   beckon search files       fuzzy search
#   beckon resolve Spotify    validate an id

set $beckon exec beckon

# Ctrl + Super + Alt, the same chord the macOS and Windows examples use, in the
# order the three keys sit in on the bottom row. `Mod4` is Super and `Mod1` is
# Alt — X11's own names, which sway and i3 both take, so one spelling serves
# this file and the i3 one.
#
# It is NOT `$mod`. That is your own variable and your own bindings live on it,
# so a sourced file that reached for it would be taking five of your letters —
# and a three-modifier chord is unlikely to collide with anything you already
# have, which is the point of using one.
set $beckonMod Ctrl+Mod4+Mod1

# Names as a Linux desktop reports them. Your terminal and file manager are
# the two most likely to differ — `beckon installed` tells you which you have.
bindsym $beckonMod+t     $beckon kitty
bindsym $beckonMod+c     $beckon "Google Chrome"
bindsym $beckonMod+v     $beckon "Visual Studio Code"
bindsym $beckonMod+f     $beckon Files
bindsym $beckonMod+s     $beckon Spotify
