# beckon bindings for sway. Save at ~/.config/sway/beckon.conf and add
# this line to your ~/.config/sway/config:
#
#   include ~/.config/sway/beckon.conf
#
# Reload: swaymsg reload (or $mod+Shift+c if you keep the default binding).
#
# Discover ids on your machine:
#   beckon installed          list installed apps
#   beckon list               list currently running apps
#   beckon search files       fuzzy search
#   beckon resolve Spotify    validate an id

set $beckon exec beckon

# Names as a Linux desktop reports them. Your terminal and file manager are
# the two most likely to differ — `beckon installed` tells you which you have.
bindsym $mod+t     $beckon kitty
bindsym $mod+c     $beckon "Google Chrome"
bindsym $mod+v     $beckon "Visual Studio Code"
bindsym $mod+f     $beckon Files
bindsym $mod+s     $beckon Spotify
