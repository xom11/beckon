# beckon resident-mode shortcuts for Windows.
#
# Validate before installing:  beckon check apps.toml
# Run in the foreground:       beckon serve apps.toml
#
# Format: flat TOML. Every key is a hotkey combo, every value is an app
# Name (or `"App A || App B"` fallback chain). Edits apply live — beckon
# watches this file. Set `tray = false` at the top to hide the tray icon.
#
# Modifiers: ctrl, super (= the Windows key), alt, shift. Order is free.
# Keys must be lowercase: a-z, 0-9, f1-f20, and the named specials
# (space, comma, period, slash, minus, equal, semicolon, quote,
#  bracketleft, bracketright, backslash, grave, tab, return, escape,
#  backspace, delete, home, end, pageup, pagedown, up, down, left, right).
# For a shifted binding write the base key plus `shift` explicitly:
#   "ctrl+super+alt+shift+t"   — not "ctrl+super+alt+T".
#
# Ctrl+Win+Alt matches the AutoHotkey example and rarely collides with
# built-in Windows shortcuts. Prefer exact friendly names from
# `beckon installed` — `File Explorer`, not `Explorer`.

"ctrl+super+alt+t"     = "Terminal"
"ctrl+super+alt+c"     = "Google Chrome"
"ctrl+super+alt+v"     = "Visual Studio Code"
"ctrl+super+alt+f"     = "File Explorer"
"ctrl+super+alt+s"     = "Spotify"

# Optional cold-launch guards (focus / cycle when open stays single-press):
# "ctrl+super+alt+d"   = { app = "Discord", launch = "confirm" }  # press twice within 2s to start
# "ctrl+super+alt+g"   = { app = "Steam", launch = false }        # focus only, never start
