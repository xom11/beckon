[workspace]
resolver = "2"
members = [
    "crates/beckon-core",
    "crates/beckon-linux",
    "crates/beckon-macos",
    "crates/beckon-windows",
    "crates/beckon-cli",
]

[workspace.package]
version      = "0.9.18"
edition      = "2021"
license      = "MIT OR Apache-2.0"
# The floor the COMMITTED LOCKFILE can actually build, not an aspiration.
# This said 1.75 while `Cargo.lock` pinned `clap 4.6.1` (edition 2024,
# `rust-version = "1.85"`, an unconditional dependency of beckon-cli) and
# `plist 1.9.0` (`1.88.0`, reached from beckon-macos), so `cargo build
# --release` on the advertised toolchain aborted with "requires rustc 1.85".
# One value is inherited by all five crates, so it has to be the highest of
# them; nothing in CI pins a toolchain, so nothing catches a drift here.
rust-version = "1.88"

[workspace.dependencies]
anyhow     = "1"
thiserror  = "2"
clap       = { version = "4", features = ["derive"] }
swayipc    = "3"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
x11rb      = "0.13"
zbus       = "4"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
