name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The page's own test suite, AHEAD of the publish rather than beside it.
  # `ci.yml` runs the same script on the same push, but `needs:` cannot reach
  # across workflows — so without this job the artifact went live while that
  # run was still going red, and a wrong install command sat on the public
  # page until a human noticed. `tools/check-site.sh` calls that "the one
  # error a landing page cannot afford"; ~5 s of ubuntu buys it.
  check:
    name: Landing page checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./tools/check-site.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
