name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exclude_flags: --exclude beckon-macos --exclude beckon-windows
          - os: macos-latest
            exclude_flags: --exclude beckon-linux --exclude beckon-windows
          - os: windows-latest
            exclude_flags: --exclude beckon-linux --exclude beckon-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace ${{ matrix.exclude_flags }} --all-targets
      - name: the whole workspace still compiles, unexcluded
        # Runs where nix builds beckon, and nowhere else. Every step around
        # this one passes `--exclude`, so no job in this file ever compiled
        # `beckon-macos` or `beckon-windows` off its own OS -- and a bare
        # `cargo build` at the workspace root does. `nix/package.nix` is
        # exactly that build: `rustPlatform.buildRustPackage` runs cargo at
        # the root with no `-p` and no excludes, so every workspace member is
        # compiled for the host.
        #
        # Measured at v0.9.3: `beckon-windows/src/lib.rs` declared `pub mod
        # shell;` with no `#[cfg(target_os = "windows")]`, all three jobs here
        # were green, and `nix build` failed with four E0433s for the
        # target-gated `windows` crate -- taking down every NixOS and nix-
        # darwin host that carries beckon as a flake input.
        #
        # Windows is deliberately left out: nothing builds beckon with nix
        # there (scoop packages the `release.yml` artefact), so the same rule
        # would only add an unmeasured leg to the one job that must stay
        # trustworthy.
        #
        # `check` rather than `build`: E0433 is a name-resolution error, so
        # metadata-only catches the whole class at a fraction of the time.
        # `--all-targets` because examples are workspace targets too and carry
        # their own guards.
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace ${{ matrix.exclude_flags }}
      - name: manifest reached the binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # embed-resource swallows resource-compilation failures silently, so
          # the only trustworthy check is reading the artefact back. The
          # manifest is stored as raw UTF-8 XML in the resource section, so a
          # byte search for its most distinctive literal is sufficient --
          # nothing else in beckon contains this string. It cannot tell
          # RT_MANIFEST from an incidental copy, which is a limit worth
          # accepting for two lines of CI.
          $exe = "target/debug/beckon-serve.exe"
          if (-not (Test-Path $exe)) { throw "not built: $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text  = [Text.Encoding]::UTF8.GetString($bytes)
          foreach ($needle in @("Microsoft.Windows.Common-Controls", "PerMonitorV2")) {
            if ($text -notmatch [regex]::Escape($needle)) {
              throw "manifest missing from $exe (no '$needle'). embed-resource fails silently; check beckon.rc and beckon.exe.manifest."
            }
          }
          Write-Host "manifest present"

      - name: the binary actually starts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The byte search above proves the manifest is IN the binary. It
          # cannot prove Windows accepts it. Measured on a14 2026-08-11: a
          # manifest whose XML comments contained `--` (illegal inside an XML
          # comment) embedded perfectly, passed the search above, and then
          # every binary failed to start with "the side-by-side configuration
          # is incorrect". Three code reviews, a byte-search gate and a
          # cross-compile check all went green on it.
          #
          # Running the thing is the only gate that catches that class, and it
          # costs one process start. Console subsystem only: beckon-serve.exe
          # answers --version with a MessageBox, which would hang a runner.
          $exe = "target/debug/beckon.exe"
          if (-not (Test-Path $exe)) { throw "not built: $exe" }
          $out = & $exe --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "beckon.exe --version exited $LASTEXITCODE. Output: $out"
          }
          if ($out -notmatch "beckon") {
            throw "beckon.exe --version printed something unexpected: $out"
          }
          Write-Host "starts cleanly: $out"
      - name: Clippy
        run: cargo clippy --workspace ${{ matrix.exclude_flags }} --all-targets -- -D warnings

  site:
    name: Landing page checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./tools/check-site.sh
