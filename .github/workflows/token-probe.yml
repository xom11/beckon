name: PACKAGER_TOKEN scope probe

# Temporary. Answers one question: does PACKAGER_TOKEN still have write
# access to both packager repos? Delete this file once it has answered.
#
# Why this is needed rather than re-running the bump: both packager repos
# are public, so `git clone` with the token succeeds even if the token is
# dead, and bump-packagers.yml exits 0 before `git push` whenever the
# rendered manifest is unchanged. A backfill run is therefore green whether
# the token works or not.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Can the token write to the packager repos?
    runs-on: ubuntu-latest
    steps:
      - name: Ask GitHub what this token may do
        env:
          GH_TOKEN: ${{ secrets.PACKAGER_TOKEN }}
        run: |
          set -uo pipefail
          fail=0
          for repo in xom11/homebrew-tap xom11/scoop-bucket; do
            # A fine-grained PAT cannot even see a repo it was not granted,
            # so 404 here means "not in the token's repository list".
            if ! body=$(gh api "repos/$repo" 2>&1); then
              echo "::error::$repo -> the token cannot read this repo at all"
              echo "   $body" | head -3
              fail=1
              continue
            fi
            push=$(printf '%s' "$body" | jq -r '.permissions.push')
            echo "$repo -> permissions.push = $push"
            if [ "$push" != "true" ]; then
              echo "::error::$repo -> token has NO write access (Contents must be 'Read and write')"
              fail=1
            fi
          done

          echo
          echo "token identity:"
          gh api rate_limit --jq '"  requests remaining: \(.rate.remaining)"' || true

          if [ "$fail" -ne 0 ]; then
            echo "::error::PACKAGER_TOKEN is not usable for the next release"
            exit 1
          fi
          echo "PACKAGER_TOKEN can write to both packager repos."
