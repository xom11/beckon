[package]
name         = "beckon-windows"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
beckon-core = { path = "../beckon-core" }
anyhow      = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = "3"

# `settings_probe` reads a comctl32 control that lives in ANOTHER process.
# comctl32 messages are not marshalled across the process boundary the way
# `WM_GETTEXT` is (only user32's own controls get that), so `LVM_GETITEMRECT`
# with a local `RECT*` would have the target write through our pointer into
# its own address space -- garbage back, and a live `beckon-serve` corrupted.
# The buffer therefore has to be allocated inside the target. Dev-only: the
# library itself must never need to poke another process's memory.
[target.'cfg(target_os = "windows")'.dev-dependencies.windows]
version = "0.61"
features = ["Win32_System_Diagnostics_Debug", "Win32_System_Memory"]
