[package]
name         = "beckon-cli"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "beckon_cli"
path = "src/lib.rs"

[[bin]]
name = "beckon"
path = "src/main.rs"

[[bin]]
name = "beckon-serve"
path = "src/bin/beckon-serve.rs"

[dependencies]
beckon-core = { path = "../beckon-core" }
anyhow      = { workspace = true }
clap        = { workspace = true }
fs4         = "0.8"
notify      = "6"

[target.'cfg(target_os = "linux")'.dependencies]
beckon-linux = { path = "../beckon-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
beckon-macos = { path = "../beckon-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
beckon-windows = { path = "../beckon-windows" }

[dev-dependencies]
tempfile = "3"
