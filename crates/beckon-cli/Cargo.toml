[package]
name         = "beckon-cli"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "beckon_cli"
path = "src/lib.rs"

[[bin]]
name = "beckon"
path = "src/main.rs"

[[bin]]
name = "beckon-serve"
path = "src/bin/beckon-serve.rs"

[dependencies]
beckon-core = { path = "../beckon-core" }
anyhow      = { workspace = true }
clap        = { workspace = true }
fs4         = "0.8"
notify      = "6"

[target.'cfg(target_os = "linux")'.dependencies]
beckon-linux = { path = "../beckon-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
beckon-macos = { path = "../beckon-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
beckon-windows = { path = "../beckon-windows" }

[dev-dependencies]
tempfile   = "3"
serde_json = { workspace = true }

# Scoped to Windows only: an unconditional [build-dependencies] entry here
# compiled embed-resource and its transitive deps on every platform to run
# a build.rs that does nothing off Windows (see build.rs). Cargo resolves
# a build-dependency's target cfg against the HOST running cargo (build
# scripts always execute on the host, even when cross-compiling) rather
# than the crate's own --target -- verified with `cargo check --target
# x86_64-pc-windows-gnu -p beckon-cli -v` from this macOS host: no
# embed-resource compilation appears in the log. So this excludes the
# crate equally from a plain native build here AND from WINCHECK's
# cross-compile to windows-gnu; on a real Windows host it is `cfg(windows)`
# regardless of which Windows target is being built.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"
