[package]
name         = "beckon-macos"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
beckon-core = { path = "../beckon-core" }
thiserror   = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSDictionary", "NSError", "NSObject", "NSEnumerator", "NSValue", "NSAttributedString", "NSProcessInfo"] }
objc2-app-kit    = { version = "0.3", features = [
    "NSWorkspace", "NSRunningApplication",
    # The menu bar item (src/tray.rs). NSStatusBarButton is what
    # `NSStatusItem::button` hands back, and NSResponder/NSControl/NSButton
    # are its superclasses -- omitting any of them makes `button()` return a
    # type that does not exist.
    "NSStatusBar", "NSStatusItem", "NSStatusBarButton",
    "NSMenu", "NSMenuItem", "NSApplication",
    "NSResponder", "NSControl", "NSButton", "NSView", "NSCell", "NSButtonCell",
    "NSImage", "NSGraphics",
    # The settings window (src/settings_window.rs). NSStackView is what
    # keeps this file from growing the ~2000 lines of manual layout
    # arithmetic the Win32 twin needs -- AppKit does the band stacking.
    "NSWindow", "NSPanel", "NSStackView", "NSLayoutConstraint",
    "NSTableView", "NSTableColumn", "NSScrollView", "NSClipView",
    "NSTextField", "NSTextFieldCell", "NSText", "NSPopUpButton",
    "NSPopUpButtonCell", "NSSecureTextField", "NSBox", "NSFont", "NSColor",
    "NSAlert", "NSUserInterfaceItemIdentification", "NSAccessibilityProtocols",
    "NSLayoutAnchor", "NSAnimation", "NSDragging", "NSPasteboard",
    # The new menu row kinds (src/tray.rs): the header's switch, the
    # right-aligned chord column (NSTextTab lives in the NSParagraphStyle
    # module) and its measurement (`size()`, gated on the app-kit crate's
    # own `objc2-core-foundation` feature, which none of the rows above
    # happen to imply).
    "NSSwitch", "NSParagraphStyle", "NSStringDrawing", "objc2-core-foundation",
    # ⌥-click on the status item (src/tray.rs): reading the current event's
    # modifier flags and type, and `NSControl::sendActionOn`, are both gated
    # behind this feature -- `performClick` and the rest of NSControl are
    # not, which is why it was not already on.
    "NSEvent",
] }
core-foundation  = "0.10"
plist            = "1"
