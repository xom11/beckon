[package]
name         = "beckon-macos"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
beckon-core = { path = "../beckon-core" }
thiserror   = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSDictionary", "NSError", "NSObject", "NSEnumerator", "NSValue"] }
objc2-app-kit    = { version = "0.3", features = [
    "NSWorkspace", "NSRunningApplication",
    # The menu bar item (src/tray.rs) and `tray_probe`'s control window.
    "NSStatusBar", "NSStatusItem", "NSStatusBarButton",
    "NSMenu", "NSMenuItem", "NSApplication",
    "NSResponder", "NSControl", "NSButton", "NSView", "NSCell", "NSButtonCell",
    "NSImage", "NSGraphics", "NSBox", "NSFont", "NSColor",
    "NSTextField", "NSTextFieldCell", "NSText", "NSAccessibilityProtocols",
    "NSWindow",
] }
core-foundation  = "0.10"
plist            = "1"
